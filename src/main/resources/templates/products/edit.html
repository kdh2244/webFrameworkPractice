<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>상품 수정 - HanSung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(90deg, #1a1a2e, #0f3460); }
        .navbar-brand { font-weight: 800; color: #e94560 !important; font-size: 1.4rem; }
        .page-header { border-left: 4px solid #e94560; padding-left: 1rem; }
        .table thead { background: #0f3460; color: #fff; }
        .table tbody tr:hover { background-color: #f0f4ff; }
        .badge-stock-high { background-color: #22c55e; }
        .badge-stock-low { background-color: #f59e0b; }
        .badge-stock-out { background-color: #ef4444; }
        .product-price { font-weight: 700; color: #e94560; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">HanSung</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/home}">홈</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/products}">상품 목록</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/products/add}">상품 등록</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/dashboard}">관리자</a>
                </li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button class="btn btn-outline-light btn-sm px-3">로그아웃</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="page-header">
            <h4 class="fw-bold mb-0">상품 수정</h4>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <form method="post" th:action="@{/products/{id}/edit(id=${productId})}">
                    <label>
                        상품이름 :
                        <input name="name" type="text" th:placeholder="${productDto.name}">
                    </label><br>
                    <label>
                        가격 :
                        <input name="price" type="number" th:placeholder="${productDto.price}">
                    </label><br>
                    <label>
                        상품설명 :
                        <textarea name="description" th:placeholder="${productDto.description}"></textarea>
                    </label><br>
                    <label>
                        재고 :
                        <input name="stock" type="number" th:placeholder="${productDto.stock}">
                    </label><br>
                    <button type="submit" class="btn btn-danger btn-sm px-4 fw-semibold"
                       sec:authorize="hasRole('ADMIN')">수정 완료</button>
                </form>
            </div>
        </div>
    </div>


    <p th:text="${'실습 수행: ' + #temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm:ss')
+' | 학번 : 2171057 | 성명 : 김도훈 '}"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
